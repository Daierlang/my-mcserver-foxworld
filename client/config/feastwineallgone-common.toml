[night_stealing]
	#夜间偷酒触发概率（1-100）。玩家入睡时检查一次。
	#Night barrel-stealing chance checked when the player goes to sleep.
	# Default: 25
	# Range: 1 ~ 100
	stealChance = 25
	#成功完成夜间偷酒后，女仆不回床而在酒桶旁/记录地点醉倒的概率（0-100）。
	#Chance that a maid sleeps at a drunk-sleep location instead of returning to bed after a successful night theft.
	# Default: 25
	# Range: 0 ~ 100
	drunkSleepChance = 25
	#醉眠后若主人一直没有唤醒女仆，多少秒后女仆会自行醒来并回到主人身边。0 = 关闭自动醒来。
	#Seconds before a drunk-sleeping maid wakes herself and returns to her owner. 0 disables automatic wake-up.
	# Default: 120
	# Range: 0 ~ 3600
	drunkSleepAutoWakeSeconds = 120
	#夜间偷酒时搜索森罗酒馆酒桶的半径。
	#Search radius used to find Kaleidoscope Tavern barrels.
	# Default: 64
	# Range: 1 ~ 64
	searchRadius = 64
	#一次夜间偷酒事件最多喝掉多少份。
	#Maximum servings stolen during one nighttime barrel event.
	# Default: 5
	# Range: 1 ~ 5
	maxDrinks = 5
	#夜间偷酒卡死保护时间（秒）。超过后强制结束本次行为。
	#Safety watchdog for a stuck nighttime event.
	# Default: 60
	# Range: 10 ~ 180
	sessionTimeoutSeconds = 60

[idle_activity]
	#酒狐空闲时再次考虑‘吃饭/拿吧台酒’的最短随机间隔。20 tick = 1 秒。
	#Minimum random wait between ordinary idle FOOD/DRINK decisions.
	# Default: 200
	# Range: 20 ~ 72000
	minAttemptTicks = 200
	#酒狐空闲时再次考虑‘吃饭/拿吧台酒’的最长随机间隔。20 tick = 1 秒。
	#Maximum random wait between ordinary idle FOOD/DRINK decisions.
	# Default: 600
	# Range: 20 ~ 72000
	maxAttemptTicks = 600
	#附近同时存在食物和吧台酒时，完成一个行为后再次选择下一行为的间隔。
	#默认 10 tick = 0.5 秒。调高可避免酒狐在自助餐桌前连续狂吃狂喝。
	#Delay before the next FOOD/DRINK choice when both activity types are available.
	# Default: 10
	# Range: 1 ~ 72000
	mixedHandoffTicks = 10
	#空闲酒狐搜索可食用方块的半径。
	#Radius around an idle maid used to search for supported placed food.
	# Default: 8
	# Range: 1 ~ 32
	foodSearchRadius = 8
	#酒狐已经吃掉森罗厨房拼盘前两份后，继续把剩余部分吃光的概率（0-100）。
	#Chance to finish the rest of a Kaleidoscope Cookery platter after the first two servings.
	# Default: 25
	# Range: 0 ~ 100
	platterFinishAllChance = 25

[generic_placed_food]
	#启用未知模组方块食物的保守通用兼容。
	#亿宴酊蒸会识别 bites、servings、cuts、stack 等常见份数属性，
	#但只有在能找到真实可食用份额 ItemStack 时才会接管。
	enabled = true
	#Enable direct eating fallback after all slice handlers.
	#Enable for placed cakes without a separate edible slice.
	direct_bite_enabled = true
	#Allow isolated FakePlayer right-click after native edible adapters decline.
	#Never force unknown food block state changes.
	direct_bite_fake_player = true
	#禁止通用食物兼容触碰的方块注册名列表。
	#如果某个非食物方块碰巧也使用 bites/servings/cuts/stack，可在此加入黑名单。
	blacklist = []

[external_compatibility]
	#兼容农场物语整合包的 KubeJS 可放置食物/饮料标签系统。
	#未安装对应内容时不会产生任何影响，也不会把它变成强制前置。
	farmingTalesPlaceableConsumables = true
	#兼容丰饶食记（Bountiful Fares）的派、挞和同类 bites 方块食物。
	#该兼容通过注册名/类层级字符串检测，不要求丰饶食记作为强制前置。
	bountifulFaresPastries = true

[favorite_foods]
	#酒狐最爱食物/饮料白名单（注册名）。
	#可以填写方块 ID，也可以填写物品 ID。最爱目标会优先于普通随机吃饭/拿酒。
	#默认：minecraft:cake
	whitelist = ["minecraft:cake"]

[dining_surfaces]
	#额外允许空闲酒狐在其上方吃放置食物的方块注册名。
	#森罗厨房餐桌始终允许，无需重复填写。
	#Additional block IDs that may act as ordinary idle dining surfaces.
	#Kaleidoscope Cookery tables are always allowed.
	whitelist = []
	#额外允许坐着吃饭时作为桌面的方块注册名。
	#普通用餐桌面白名单中的方块也会自动允许坐着吃，无需重复填写。
	#Additional block IDs that may act as seated-dining surfaces.
	#Ordinary dining-surface whitelist entries are inherited automatically.
	seatedWhitelist = []

[counter_drinking]
	#允许空闲酒狐拿走直接摆在森罗酒馆吧台上的酒。
	enabled = true
	#空闲酒狐允许从哪些方块上方拿取森罗酒馆饮料。
	#默认仅包含森罗酒馆吧台；默认项本身也可以删除。
	#可填写任意已注册方块 ID。列表为空时，空闲状态不会从任何台面拿酒。
	#Allowed support-block IDs for idle counter drinking.
	#The Kaleidoscope Tavern bar counter is only a removable default entry, not hard-coded behavior.
	surfaceWhitelist = ["kaleidoscope_tavern:bar_counter"]
	#空闲酒狐搜索吧台酒的半径。
	# Default: 8
	# Range: 1 ~ 32
	searchRadius = 8
	#酒狐喝第一瓶后，再顺手拿走第二瓶塞进背包的概率（0-100）。
	# Default: 35
	# Range: 0 ~ 100
	takeTwoChance = 35
	#酒狐尝试走到吧台酒前的最大时间。20 tick = 1 秒。
	# Default: 200
	# Range: 20 ~ 1200
	approachTimeoutTicks = 200

[fruit_tasting]
	#酒狐处于普通空闲决策时，触发一次水果品尝循环的概率（百分比）。
	#默认 25%。未触发时水果不会作为一个强制活动类型吸引酒狐。
	#Chance (percent) for an ordinary idle decision to start one fruit-tasting cycle.
	# Default: 25
	# Range: 0 ~ 100
	triggerChance = 25
	#水果品尝循环开始时搜索成熟水果的水平半径。
	#循环按水果种类而不是方块数量规划，每种水果最多品尝一次。
	#Horizontal search radius used when a fruit-tasting cycle starts.
	# Default: 8
	# Range: 1 ~ 32
	searchRadius = 8
	#一次水果品尝循环恰好计划品尝两种不同水果的概率（百分比）。默认 35%。
	#若附近只有一种水果，则只会品尝一种。
	#Chance (percent) for a tasting cycle to sample exactly two distinct fruit types.
	# Default: 35
	# Range: 0 ~ 100
	twoTypeChance = 35
	#一次水果品尝循环进入“不封顶”模式的概率（百分比）。默认 25%。
	#触发后会按种类各品尝一次循环开始时发现的所有成熟水果；种了多少种就最多尝多少次。
	#Chance (percent) for an uncapped cycle that samples every distinct fruit type discovered at cycle start.
	# Default: 25
	# Range: 0 ~ 100
	allTypeChance = 25
	#空闲品尝水果时，酒狐决定偷吃丰饶食记成熟金苹果的概率（百分比）。
	#0 = 永不偷吃，100 = 发现成熟金苹果时总会将其视为可品尝目标。
	#Chance (percent) for idle fruit tasting to consider a ripe Bountiful Fares golden apple as a sneaky snack.
	# Default: 25
	# Range: 0 ~ 100
	goldenAppleStealChance = 25
	#酒狐优先品尝的水果物品注册名。默认留空，不预设任何喜欢水果。
	#玩家仍可自行加入物品 ID；优先规则只使用一次，吃过喜欢水果后下一次强制回到全部候选随机选择。
	#Favorite fruit item IDs. Empty by default; no fruit receives built-in priority.
	#Players may add item IDs manually. Favorite priority remains one-shot; the next tasting returns to the full random pool.
	preferredFruits = []

[meal_feedback]
	#最后一次成功吃喝后多久结算本顿正餐（秒）。
	# Default: 60
	# Range: 5 ~ 600
	mealEndTimeoutSeconds = 60
	#合格正餐后的进食冷却（现实分钟）。水果品尝与饮酒不受此冷却影响。
	# Default: 5
	# Range: 0 ~ 120
	mealCooldownMinutes = 5
	#是否在女仆头顶显示距离再次饥饿的倒计时。
	showCooldownTimer = true
	#每个 Minecraft 日最多登记多少顿正式正餐。达到上限后仍可进食，但不再登记正餐。
	# Default: 3
	# Range: 0 ~ 64
	maxMealsPerDay = 3
	#一只女仆一生最多获得多少次正餐成长。设为 0 = 保留正反馈但关闭属性/好感成长。
	#Increasing this may create an extremely powerful maid. This is intentional.
	# Default: 10
	# Range: > 0
	maxRewardedMeals = 10
	#丰盛正餐每次增加的最大生命。
	# Default: 6.0
	# Range: 0.0 ~ 1000000.0
	normalMealHealth = 6.0
	#丰盛正餐每次增加的护甲。
	# Default: 5.0
	# Range: 0.0 ~ 1000000.0
	normalMealArmor = 5.0
	#喜爱正餐每次增加的最大生命。
	# Default: 10.0
	# Range: 0.0 ~ 1000000.0
	favoriteMealHealth = 10.0
	#喜爱正餐每次增加的护甲。
	# Default: 10.0
	# Range: 0.0 ~ 1000000.0
	favoriteMealArmor = 10.0

[inventory_drinking]
	#允许空闲酒狐饮用自己背包中的森罗酒馆酒水。
	enabled = true
	#酒狐考虑从背包喝酒的最短随机间隔。20 tick = 1 秒。
	# Default: 1200
	# Range: 20 ~ 72000
	minAttemptTicks = 1200
	#酒狐考虑从背包喝酒的最长随机间隔。20 tick = 1 秒。
	# Default: 3600
	# Range: 20 ~ 72000
	maxAttemptTicks = 3600
	#健康状态下，酒狐仅仅因为嘴馋而从背包喝酒的概率（0-100）。
	# Default: 20
	# Range: 0 ~ 100
	cravingChance = 20
	#生命值低于该百分比时，酒狐跳过普通嘴馋概率并尝试喝背包中的酒。
	#酒本身是否治疗仍由森罗酒馆的酒水效果决定。
	# Default: 70
	# Range: 1 ~ 100
	injuredHealthPercent = 70

[rococo_tea_party]
	#Enable afternoon tea during maid schedule IDLE leisure.
	enabled = true
	#Tea-party chance (%) when the maid checks a leisure activity.
	# Default: 18
	# Range: 0 ~ 100
	chancePercent = 18
	#Rococo tea-party search radius in blocks.
	# Default: 12
	# Range: 2 ~ 24
	searchRadius = 12
	#Minimum snacks/drinks needed for tea reward.
	# Default: 1
	# Range: 1 ~ 3
	minimumServings = 1
	#Maximum tea-party session length in seconds.
	# Default: 75
	# Range: 30 ~ 240
	sessionSeconds = 75
	#Tea-party reward cooldown in minutes.
	# Default: 20
	# Range: 0 ~ 240
	cooldownMinutes = 20
	#Favorability gained from successful tea.
	# Default: 20
	# Range: 0 ~ 1000
	favorabilityReward = 20
	#Temporary tea-party armor bonus.
	# Default: 10.0
	# Range: 0.0 ~ 100.0
	bonusArmor = 10.0
	#Temporary tea-party maximum-health bonus.
	# Default: 10.0
	# Range: 0.0 ~ 100.0
	bonusMaxHealth = 10.0
	#Tea-party armor/health bonus length in seconds; zero disables buffs.
	# Default: 600
	# Range: 0 ~ 72000
	buffSeconds = 600

[shared_dining_pacing]
	#Minimum wait after each finished serving (ticks). Applies to formal seated meals AND tea parties; 20 ticks = 1 second.
	# Default: 30
	# Range: 0 ~ 1200
	minBetweenServingsTicks = 30
	#Maximum wait after each finished serving (ticks). Applies to formal seated meals AND tea parties.
	# Default: 60
	# Range: 0 ~ 1200
	maxBetweenServingsTicks = 60

[rococo_tea_party_pacing]
	#Minimum seconds between completed tea-party servings, including the bite animation; 20 ticks = 1 second.
	# Default: 6
	# Range: 1 ~ 600
	minSecondsBetweenServings = 6
	#Maximum seconds between completed tea-party servings. If below minimum, the two values are swapped at runtime.
	# Default: 12
	# Range: 1 ~ 600
	maxSecondsBetweenServings = 12

[rococo_tea_party_weights]
	#点心架来源的相对权重；只有点心架和桌面都有食物时才比较。
	# Default: 40
	# Range: 0 ~ 1000
	traySourceWeight = 40
	#桌面可放置食物/酒/茶的相对权重；只有两类来源都有食物时才比较。
	# Default: 60
	# Range: 0 ~ 1000
	tableSourceWeight = 60
